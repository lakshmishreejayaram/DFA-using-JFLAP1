
<section class="panel">
  <h2>DFA: Strings Ending with "aab"</h2>
  <p class="hint">
    Alphabet: {a, b}. Accepts strings whose last three characters are aab.
  </p>

  <form id="aab-form">
    <label for="aab-input">Enter a string</label>
    <div class="input-row">
      <input id="aab-input" type="text"
             placeholder="Example: aaab" autocomplete="off">
      <button type="submit">Test String →</button>
    </div>
  </form>

  <div id="aab-result" class="result" aria-live="polite">
    Enter a string to test.
  </div>
</section>
